name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lunarmodules/luacheck@v1

  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check text keys
        run: bash .github/scripts/check-locales.sh
