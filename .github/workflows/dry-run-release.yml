name: Dry-run release

# Packages the addon like a release, without uploading anything.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version whose CHANGELOG.md section to use, e.g. 1.2.0
        required: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the packager reads the version from the tags

      - name: Extract this version's section from CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash .github/scripts/changelog-section.sh "$VERSION" > RELEASE_CHANGELOG.md
          cat RELEASE_CHANGELOG.md

      - uses: BigWigsMods/packager@v2
        with:
          args: -d # skip uploading

      - name: Keep the zip as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: dry-run
          path: .release/*.zip
