name: Release

on:
  release:
    types: [published]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the zip to the GitHub release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the packager reads the version from the tag

      - name: Extract this release's section from CHANGELOG.md
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_CHANGELOG.md

          if ! grep -q '[^[:space:]]' RELEASE_CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
